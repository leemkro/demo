spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:p6spy:postgresql://localhost:5433/postgres}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

# JWT 설정
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong12345}
  expiration: ${JWT_EXPIRATION:604800000}  # 7일 (밀리초)

# 서버 설정
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
